app:
  env: "production"
  debug: false
  log_level: "INFO"
  timezone: "Europe/Kyiv"

search:
  brand: "Audi"
  model: "A6"
  generation: "C5"
  min_year: 1997
  max_year: 2005
  target_engines:
    - code: "1.8T"
      displacement: 1.8
      fuel: "petrol"
      turbo: true
    - code: "2.4"
      displacement: 2.4
      fuel: ["petrol", "lpg"]
      turbo: false
    - code: "1.9TDI"
      displacement: 1.9
      fuel: "diesel"
      turbo: true

database:
  url: "postgresql+asyncpg://postgres:postgres@localhost:5432/car_db"
  pool_size: 5
  max_overflow: 10
  pool_timeout: 30.0

parsers:
  auto_ria:
    enabled: true
    request_delay: 1.5
    timeout: 15.0
    max_pages: 3
  olx:
    enabled: true
    request_delay: 2.0
    timeout: 20.0
    max_pages: 3
  rst:
    enabled: true
    request_delay: 1.2
    timeout: 15.0
    max_pages: 2
  telegram:
    enabled: true
    api_id: null
