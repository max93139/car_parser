name: Audi A6 C5 Car Parser & Monitor

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run at 08:00, 14:00, 20:00 UTC
    - cron: '0 8 * * *'
    - cron: '0 14 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (do not send Telegram alerts)'
        required: false
        type: boolean
        default: false
      source:
        description: 'Run specific source parser only (e.g. auto_ria, olx, rst, telegram, instagram)'
        required: false
        type: string
        default: ''

jobs:
  run-parser:
    name: Run Audi A6 C5 Parser
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e .

      - name: Run Test Suite
        env:
          CI: "true"
        run: |
          pytest -v

      - name: Run Car Parser Pipeline
        env:
          CI: "true"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          INSTAGRAM_SESSION_COOKIE: ${{ secrets.INSTAGRAM_SESSION_COOKIE }}
        run: |
          CMD_ARGS=""
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            CMD_ARGS="$CMD_ARGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.source }}" ]; then
            CMD_ARGS="$CMD_ARGS --source ${{ github.event.inputs.source }}"
          elif [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "pull_request" ]; then
            CMD_ARGS="$CMD_ARGS --source auto_ria"
          fi
          python -m src.main $CMD_ARGS
